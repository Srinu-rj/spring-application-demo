name: Spring boot Java CI CD with Docker

on:
  push:
    branches: [ "master" ]

env:
  PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_TASK_DEFINITION_FAMILY: ${{ secrets.ECS_TASK_DEFINITION_FAMILY }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
  GIT_EMAIL: ${{ secrets.GIT_EMAIL}}
  GIT_USERNAME: ${{ secrets.GIT_USERNAME}}
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
  ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}

jobs:
  Building-and-Testing:
    runs-on: ubuntu-latest
    steps:
      #TODO action is used to download your repository's code onto the runner so that it can be built, tested, or deployed
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'  # temurin
          java-version: '21'
          architecture: x64
      - name: Setup Maven
        uses: stCarolas/setup-maven@v4.4
        with:
          maven-version: 3.9.9 #todo Use Updated Version
      - name: Build and Run Unit Tests
        run: mvn clean install
      #      - uses: actions/upload-artifact@v4
      #        with:
      #          name: Package
      #          path: staging
      #      - uses: actions/download-artifact@v4
      #        with:
      #          name: Package
      #          path:
      #      - name: Deploy
      #        run: echo "Deploy successfully"

      #      - name: SonarCloud Scan
      #        uses: SonarSource/sonarcloud-github-action@master
      #        env:
      #          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #TODO--> Docker Build Tag Push
      #      - name: Login to docker hub
      #        uses: actions/checkout@v4
      #        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 # Using the official Docker login action
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Accessing the username from GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }} # Accessing the password/token from GitHub Secrets

      - name: Build docker image
        run: docker build -t spring-application-github .
      - name: Tag docker image
        run: docker tag spring-application-github srinu641/spring-application-github:V1.0
      - name: Push docker image
        run: docker push srinu641/spring-application-github:V1.0
      - name: Getting Docker Images
        run: |
          docker images
          docker inspect srinu641/spring-application-github:V1.0
          docker ps -a
      

