name: Spring boot Java CI CD with Docker

on:
  push:
    branches: [ "master" ]

env:
  PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  git-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0

  setup-jdk:
    runs-on: ubuntu-latest
    needs: git-checkout
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt' # temurin
          architecture: x64

  run-unit-tests:
    runs-on: ubuntu-latest
    needs: setup-jdk
    steps:
      #      - uses: actions/checkout@v4
      #      - name: Set up JDK 21
      #        uses: actions/setup-java@v4
      #        with:
      #          java-version: '21'
      #          distribution: 'adopt'
      #      - name: Setup Maven
      #        uses: stCarolas/setup-maven@v4.4
      #        with:
      #          maven-version: 3.8.2
      #      - name: Unit Tests
      #        run: mvn clean package
      #      - name: Rename the artifact
      #        run: cp target/spring-application-github.jar spring-application-github-${{ github.sha }}.jar
      #todo  Building and testing your code
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt' #['adopt', 'temurin']
          cache: maven
      - name: Run the Maven verify phase
        run: mvn --batch-mode --update-snapshots verify
      - run: mkdir staging && cp target/*.jar staging
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging
      - uses: actions/download-artifact@v4
        with:
          name: Package
          path:
      - name: Deploy
        run: echo "Deploy successfully"

  #      - name: Save the artifact
  #        uses: actions/upload-artifact@v4
  #        with:
  #          name: spring-application-github
  #          path: spring-application-github-${{ github.sha }}.jar
