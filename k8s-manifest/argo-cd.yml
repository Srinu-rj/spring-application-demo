apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-application-argo-cd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/anveshmuppeda/argo-cd-demo #TODO CHANGE YOUR GITHUB PROJECT URL
    targetRevision: HEAD
    path: development #TODO K8S YML Manifest direct path

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-demo

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true